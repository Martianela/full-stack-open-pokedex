name: deplying app

on:
  push:
    branches:
      - main

jobs:
  unit_testing:
    uses: ./.github/workflows/Unit_testing.yml

  e2e_testing:
    uses: ./.github/workflows/E2e_testing.yml

  installing_dependencies_and_build:
    needs: [unit_testing, e2e_testing]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20' # Specify the Node.js version you need

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

  create_versoning:
    needs: [installing_dependencies_and_build]
    runs-on: ubuntu-latest

    steps:
      - name: bump version and push tag
        uses: anothrNick/github-tag-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: 'true'

  deplying_code_to-render:
    needs: [create_versoning]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Render
        env:
          DEPLOY_URL: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: curl -X POST "$DEPLOY_URL"
