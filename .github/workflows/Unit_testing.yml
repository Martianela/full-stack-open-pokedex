name: unit testing
on:
  workflow_call:

jobs:
  testing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
      - name: install dependencies
        run: npm install
      - name: running test
        run: npm run test:unit
